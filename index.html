<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Agenda</title>

<!-- Instalação como app (iPhone, Mac) -->
<meta name="application-name" content="Agenda">
<meta name="apple-mobile-web-app-title" content="Agenda">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0d12">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">

<style>
:root{
  --bg:#0b0d12; --sup:#12151d; --sup2:#1a1f2b; --linha:#1c212c;
  --txt:#eef0f5; --txt2:#a3aabb; --txt3:#7b8296;
  --acc:#8ab4ff; --acc-forte:#aecbff; --acc-bg:rgba(138,180,255,.11);
  --erro:#ff9d9d;
  --fonte:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --lat-e:calc(16px + env(safe-area-inset-left));
  --lat-d:calc(16px + env(safe-area-inset-right));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
html{background:var(--bg);color-scheme:dark;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font-family:var(--fonte);color:var(--txt);background:var(--bg);min-width:280px;
  -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

/* ---------- estrutura ---------- */
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto}

.topo{padding:calc(14px + env(safe-area-inset-top)) var(--lat-d) 12px var(--lat-e);flex:none}
.rotulo{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--txt2);min-height:18px}
.rotulo .rel{color:var(--acc);font-weight:650}
.rotulo .sep{color:var(--txt3)}
h1{margin:2px 0 0;font-size:clamp(22px,7.2vw,28px);line-height:1.15;font-weight:700;letter-spacing:-.02em}

.barra{display:flex;align-items:center;gap:8px;margin-top:12px}
.ib{
  position:relative;width:38px;height:38px;flex:none;display:inline-grid;place-items:center;padding:0;
  border-radius:11px;border:1px solid var(--linha);background:var(--sup);color:var(--txt);cursor:pointer;
  transition:background .15s,border-color .15s;
}
.ib svg{width:18px;height:18px;pointer-events:none}
.ib:hover{background:var(--sup2);border-color:#2a3140}
.ib:active{transform:scale(.96)}
.cal{margin-left:4px}
.cal:focus-within{outline:2px solid var(--acc);outline-offset:2px}
/* o seletor de data nativo fica invisível por cima do botão do calendário */
.cal input{
  position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;border:0;opacity:0;cursor:pointer;
  -webkit-appearance:none;appearance:none;background:transparent;color:transparent;font-size:16px;
}
.cal input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;opacity:0;cursor:pointer}
.cal.por-codigo{cursor:pointer}
.cal.por-codigo input{pointer-events:none}
.hoje{
  margin-left:auto;height:38px;padding:0 15px;border-radius:11px;border:1px solid var(--linha);
  background:var(--sup);color:var(--txt);font-size:14px;font-weight:600;cursor:pointer;
  transition:background .15s,border-color .15s,opacity .15s;
}
.hoje:hover{background:var(--sup2);border-color:#2a3140}
.hoje:disabled{opacity:.38;cursor:default;background:var(--sup);border-color:var(--linha)}

/* ---------- lista ---------- */
main{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px calc(var(--lat-d) - 8px) 14px calc(var(--lat-e) - 8px);border-top:1px solid var(--linha)}
#lista{list-style:none;margin:0;padding:6px 0 0}
.ev{position:relative;display:grid;grid-template-columns:62px minmax(0,1fr);column-gap:12px;align-items:start;padding:12px 8px;border-radius:12px}
.ev + .ev::before{content:"";position:absolute;top:0;left:8px;right:8px;height:1px;background:var(--linha)}
.ev.agora::before,.ev.agora + .ev::before{display:none}
.hora{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;font-variant-numeric:tabular-nums;padding-top:1px}
.ini{font-size:15px;font-weight:650;letter-spacing:.01em}
.fim,.mini{font-size:12px;color:var(--txt3);margin-top:3px}
.mini{margin:0 0 2px}
.pilula{font-size:11px;font-weight:650;line-height:1;padding:5px 8px;border-radius:999px;background:var(--sup2);color:var(--txt2);white-space:nowrap;margin-top:1px}
.corpo{min-width:0}
.titulo{display:block;font-size:15.5px;line-height:1.36;font-weight:500;overflow-wrap:anywhere}
.tag{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin-bottom:3px;color:var(--txt2)}
.tag .quando{font-weight:500;letter-spacing:.01em;text-transform:none;color:var(--txt3)}
.ponto{width:6px;height:6px;border-radius:50%;background:var(--acc);animation:pulso 2s ease-in-out infinite}

.ev.agora{background:var(--acc-bg);box-shadow:inset 3px 0 0 var(--acc);margin:2px 0}
.ev.agora .ini,.ev.agora .tag{color:var(--acc-forte)}
.ev.agora .fim{color:var(--txt2)}
.ev.agora .titulo{font-weight:600}
.ev.proximo .ini{color:var(--txt)}
.ev.passado{opacity:.42}

/* ---------- estados (vazio, erro, carregando) ---------- */
.estado{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:44px 18px 24px;color:var(--txt2)}
.estado svg{width:40px;height:40px;color:var(--txt3);margin-bottom:14px}
.estado strong{display:block;color:var(--txt);font-size:16px;font-weight:650;margin-bottom:5px}
.estado p{margin:0;font-size:14px;line-height:1.5;max-width:300px}
.estado code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--txt);background:var(--sup2);padding:1px 5px;border-radius:5px}
.estado button{margin-top:16px;height:38px;padding:0 16px;border-radius:11px;border:1px solid var(--linha);background:var(--sup);color:var(--txt);font-size:14px;font-weight:600;cursor:pointer}
.osso{display:grid;grid-template-columns:62px 1fr;column-gap:12px;padding:14px 8px}
.osso i{display:block;height:13px;border-radius:6px;background:linear-gradient(90deg,var(--sup) 0%,var(--sup2) 50%,var(--sup) 100%);background-size:200% 100%;animation:brilho 1.4s linear infinite}
.osso i:first-child{width:42px}

/* ---------- rodapé ---------- */
.rodape{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px var(--lat-d) calc(8px + env(safe-area-inset-bottom)) var(--lat-e);border-top:1px solid var(--linha);font-size:12px;color:var(--txt3)}
.rodape button{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 2px;color:inherit;font-size:12px;cursor:pointer;border-radius:6px}
.rodape button:hover{color:var(--txt2)}
.rodape svg{width:12px;height:12px;flex:none}
.rodape .girando svg{animation:giro .9s linear infinite}
.rodape .aviso{color:var(--erro)}

/* ---------- tela de senha ---------- */
#login{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));overflow:auto}
.cartao{width:100%;max-width:320px;text-align:center}
.cartao img{width:64px;height:64px;border-radius:16px;display:block;margin:0 auto 16px}
.cartao h2{margin:0 0 6px;font-size:22px;font-weight:700;letter-spacing:-.02em}
.cartao p{margin:0 0 20px;font-size:14px;line-height:1.5;color:var(--txt2)}
.cartao input{
  width:100%;height:48px;padding:0 14px;border-radius:12px;border:1px solid #2a3140;background:var(--sup);
  color:var(--txt);font-family:inherit;font-size:16px;text-align:center;outline:none;transition:border-color .15s;
}
.cartao input:focus{border-color:var(--acc)}
.cartao button{width:100%;height:48px;margin-top:10px;border-radius:12px;border:0;background:var(--acc);color:#0b1220;font-size:15.5px;font-weight:700;cursor:pointer}
.cartao button:disabled{opacity:.6;cursor:default}
.cartao .msg{min-height:20px;margin:12px 0 0;font-size:13.5px;color:var(--erro)}

@keyframes pulso{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes brilho{to{background-position:-200% 0}}
@keyframes giro{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ponto,.osso i,.rodape .girando svg{animation:none}}
@media (max-width:340px){
  .ev{grid-template-columns:56px minmax(0,1fr);column-gap:10px}
  .osso{grid-template-columns:56px 1fr;column-gap:10px}
  .titulo{font-size:15px}
}
</style>

<body>

<div id="app" hidden>
  <header class="topo">
    <div class="rotulo" id="rotulo"></div>
    <h1 id="titulo-data"></h1>
    <div class="barra">
      <button class="ib" id="btn-ant" type="button" aria-label="Dia anterior" title="Dia anterior">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button class="ib" id="btn-prox" type="button" aria-label="Próximo dia" title="Próximo dia">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
      </button>
      <label class="ib cal" title="Escolher data">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <input type="date" id="seletor" aria-label="Escolher data">
      </label>
      <button class="hoje" id="btn-hoje" type="button">Hoje</button>
    </div>
  </header>

  <main id="rolagem">
    <ul id="lista" aria-live="polite"></ul>
  </main>

  <footer class="rodape">
    <button type="button" id="btn-atualizar" title="Atualizar agora">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 6.3M20 4v7h-7"/></svg>
      <span id="status"></span>
    </button>
    <button type="button" id="btn-sair" title="Esquecer a senha neste aparelho">sair</button>
  </footer>
</div>

<div id="login" hidden>
  <form class="cartao" id="form-login" autocomplete="off">
    <img id="login-icone" alt="">
    <h2>Agenda</h2>
    <p>Digite a senha para ver seus compromissos.</p>
    <input type="password" id="campo-senha" placeholder="Senha" aria-label="Senha" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button type="submit" id="btn-entrar">Entrar</button>
    <div class="msg" id="login-msg" role="alert"></div>
  </form>
</div>

<noscript><p style="padding:24px;font-family:sans-serif;color:#eef0f5">Este painel precisa de JavaScript ativado.</p></noscript>

<script>
/* ============================================================
   CONFIGURAÇÃO — cole aqui a URL do Web App do Apps Script
   (termina em /exec). É a única coisa que precisa trocar.
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbwxPFjH69wqbAj5LkfHdRJ0hXV839U3LdhuaV3AB9etl8IMZRJGtPUdaGuh9guNVL8a/exec';

const FUSO = 'America/Sao_Paulo';        // mesmo fuso do servidor
const ATUALIZAR_A_CADA = 5 * 60 * 1000;  // 5 minutos
const VOLTAR_PRA_HOJE_APOS = 5 * 60 * 1000; // janela escondida por mais que isso reabre em "hoje"
const CHAVE_SENHA = 'painelAgenda.senha';

/* ---------- datas (sempre AAAA-MM-DD, no fuso de São Paulo) ---------- */
const fmtPartes = new Intl.DateTimeFormat('en-US', { timeZone: FUSO, year: 'numeric', month: '2-digit', day: '2-digit' });
const fmtSemana = new Intl.DateTimeFormat('pt-BR', { timeZone: 'UTC', weekday: 'long' });
const fmtDiaMes = new Intl.DateTimeFormat('pt-BR', { timeZone: 'UTC', day: 'numeric', month: 'long' });
const fmtHora = new Intl.DateTimeFormat('pt-BR', { timeZone: FUSO, hour: '2-digit', minute: '2-digit', hour12: false });

function hoje() {
  const p = {};
  fmtPartes.formatToParts(new Date()).forEach(x => { p[x.type] = x.value; });
  return p.year + '-' + p.month + '-' + p.day;
}
// Uma data "pura" vira meio-dia UTC: nenhum fuso do aparelho consegue empurrá-la para o dia vizinho.
function comoUTC(data) {
  const [a, m, d] = data.split('-').map(Number);
  return new Date(Date.UTC(a, m - 1, d, 12));
}
function somarDias(data, n) {
  const d = comoUTC(data);
  d.setUTCDate(d.getUTCDate() + n);
  return d.toISOString().slice(0, 10);
}
function diasEntre(a, b) {
  return Math.round((comoUTC(b) - comoUTC(a)) / 86400000);
}
function dataValida(s) {
  return /^\d{4}-\d{2}-\d{2}$/.test(s) && !isNaN(comoUTC(s)) && comoUTC(s).toISOString().slice(0, 10) === s;
}

/* ---------- estado ---------- */
const $ = id => document.getElementById(id);
const cache = new Map();          // data -> { eventos, quando }
let dataSel = hoje();
let ultimoHoje = dataSel;
let pedidoAtual = 0;
let carregando = false;
let erroAtual = '';
let escondidoDesde = 0;
let assinatura = '';
let rolarAoMostrar = true;

const configurado = /^https:\/\/script\.google(usercontent)?\.com\//.test(API_URL) || /^(\/|https?:\/\/(localhost|127\.0\.0\.1))/.test(API_URL);

/* ---------- senha (fica só neste aparelho) ---------- */
function lerSenha() { try { return localStorage.getItem(CHAVE_SENHA) || ''; } catch (e) { return senhaMemoria; } }
function guardarSenha(s) { senhaMemoria = s; try { localStorage.setItem(CHAVE_SENHA, s); } catch (e) {} }
function esquecerSenha() { senhaMemoria = ''; try { localStorage.removeItem(CHAVE_SENHA); } catch (e) {} }
let senhaMemoria = '';

/* ---------- servidor ---------- */
// text/plain é um Content-Type "simples": o navegador não faz preflight (OPTIONS),
// que o Apps Script não responde. Sem cabeçalhos extras e sem cookies.
async function chamar(senha, data) {
  const ctrl = new AbortController();
  const limite = setTimeout(() => ctrl.abort(), 25000);
  let resp;
  try {
    resp = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ senha: senha, data: data }),
      redirect: 'follow',
      credentials: 'omit',
      cache: 'no-store',
      signal: ctrl.signal
    });
  } catch (e) {
    throw new Error(ctrl.signal.aborted ? 'O servidor demorou para responder.' : 'Sem conexão com o servidor.');
  } finally {
    clearTimeout(limite);
  }
  const texto = await resp.text();
  try { return JSON.parse(texto); }
  catch (e) { throw new Error('Resposta inesperada do servidor. Confira a URL do Web App.'); }
}

async function carregar() {
  if (!configurado) { render(true); return; }
  const senha = lerSenha();
  if (!senha) { mostrarLogin(''); return; }

  const data = dataSel;
  const id = ++pedidoAtual;
  carregando = true;
  render(true);

  try {
    const r = await chamar(senha, data);
    if (id !== pedidoAtual) return;           // o usuário já mudou de dia: descarta
    if (!r || r.ok !== true) {
      if (r && r.erro === 'senha') {
        carregando = false;
        esquecerSenha();
        cache.clear();
        mostrarLogin('Senha incorreta. Digite novamente.');
        return;
      }
      throw new Error((r && r.mensagem) || 'O servidor devolveu um erro.');
    }
    cache.set(data, { eventos: Array.isArray(r.eventos) ? r.eventos : [], quando: Date.now() });
    erroAtual = '';
  } catch (e) {
    if (id !== pedidoAtual) return;
    erroAtual = e.message || 'Não foi possível atualizar.';
  }
  carregando = false;
  render(true);
}

/* ---------- desenho ---------- */
function el(tag, classe, texto) {
  const n = document.createElement(tag);
  if (classe) n.className = classe;
  if (texto != null) n.textContent = texto;
  return n;
}
const ICONES = {
  livre: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>',
  erro: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5M12 16.5v.5"/><circle cx="12" cy="12" r="9"/></svg>',
  ajuste: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>'
};
function estado(icone, titulo, texto, botao) {
  const li = el('li', 'estado');
  li.innerHTML = ICONES[icone];               // SVG fixo do próprio arquivo
  li.appendChild(el('strong', '', titulo));
  const p = el('p');
  if (typeof texto === 'string') p.textContent = texto; else p.appendChild(texto);
  li.appendChild(p);
  if (botao) {
    const b = el('button', '', botao);
    b.type = 'button';
    b.addEventListener('click', carregar);
    li.appendChild(b);
  }
  return li;
}

function emQuanto(ms) {
  const min = Math.max(1, Math.round(ms / 60000));
  if (min < 60) return 'em ' + min + ' min';
  const h = Math.floor(min / 60), m = min % 60;
  return 'em ' + h + ' h' + (m ? ' ' + String(m).padStart(2, '0') : '');
}

// Agora / A seguir / já passou — só faz sentido quando o dia mostrado é hoje.
function situacoes(eventos, ehHoje, agora) {
  if (!ehHoje) return eventos.map(() => ({ classe: '', tag: '', quando: '' }));
  let proximoInicio = Infinity;
  eventos.forEach(ev => {
    if (!ev.diaTodo && ev.inicioMs > agora && ev.inicioMs < proximoInicio) proximoInicio = ev.inicioMs;
  });
  return eventos.map(ev => {
    if (ev.diaTodo) return { classe: '', tag: '', quando: '' };
    if (ev.fimMs <= agora && ev.inicioMs <= agora && !(ev.inicioMs === ev.fimMs && agora - ev.inicioMs < 60000)) {
      return { classe: 'passado', tag: '', quando: '' };
    }
    if (ev.inicioMs <= agora) return { classe: 'agora', tag: 'Agora', quando: '' };
    if (ev.inicioMs === proximoInicio) return { classe: 'proximo', tag: 'A seguir', quando: emQuanto(ev.inicioMs - agora) };
    return { classe: '', tag: '', quando: '' };
  });
}

function linha(ev, sit) {
  const li = el('li', 'ev' + (sit.classe ? ' ' + sit.classe : ''));
  const hora = el('div', 'hora');
  if (ev.diaTodo) {
    hora.appendChild(el('span', 'pilula', 'Dia todo'));
  } else if (ev.comecaAntes) {
    hora.appendChild(el('span', 'mini', 'até'));
    hora.appendChild(el('span', 'ini', ev.fim));
  } else {
    hora.appendChild(el('span', 'ini', ev.inicio));
    if (ev.terminaDepois) hora.appendChild(el('span', 'fim', 'continua'));
    else if (ev.fim && ev.fimMs !== ev.inicioMs) hora.appendChild(el('span', 'fim', ev.fim));
  }
  const corpo = el('div', 'corpo');
  if (sit.tag) {
    const tag = el('span', 'tag');
    if (sit.classe === 'agora') tag.appendChild(el('i', 'ponto'));
    tag.appendChild(document.createTextNode(sit.tag));
    if (sit.quando) tag.appendChild(el('span', 'quando', '· ' + sit.quando));
    corpo.appendChild(tag);
  }
  corpo.appendChild(el('span', 'titulo', ev.titulo || '(Sem título)'));
  li.appendChild(hora);
  li.appendChild(corpo);
  return li;
}

function render(forcar) {
  const hj = hoje();
  const ehHoje = dataSel === hj;
  const dif = diasEntre(hj, dataSel);
  const reg = cache.get(dataSel);
  const agora = Date.now();
  const sits = reg ? situacoes(reg.eventos, ehHoje, agora) : [];

  // Só redesenha se algo mudou (evita piscar a cada conferência do relógio).
  const nova = JSON.stringify([dataSel, hj, carregando, erroAtual, reg ? reg.quando : 0, sits]);
  if (!forcar && nova === assinatura) return;
  assinatura = nova;

  /* cabeçalho */
  const d = comoUTC(dataSel);
  const semana = fmtSemana.format(d);
  let diaMes = fmtDiaMes.format(d);
  if (dataSel.slice(0, 4) !== hj.slice(0, 4)) diaMes += ' de ' + dataSel.slice(0, 4);
  const rel = dif === 0 ? 'Hoje' : dif === 1 ? 'Amanhã' : dif === -1 ? 'Ontem' : '';
  const rotulo = $('rotulo');
  rotulo.replaceChildren();
  if (rel) {
    rotulo.appendChild(el('span', 'rel', rel));
    rotulo.appendChild(el('span', 'sep', '·'));
  }
  rotulo.appendChild(el('span', '', semana));
  $('titulo-data').textContent = diaMes;
  $('titulo-data').setAttribute('aria-label', semana + ', ' + diaMes);
  $('seletor').value = dataSel;
  $('btn-hoje').disabled = ehHoje;
  document.title = ehHoje ? 'Agenda' : 'Agenda · ' + diaMes;

  /* lista */
  const lista = $('lista');
  lista.replaceChildren();
  if (!configurado) {
    const p = document.createDocumentFragment();
    p.appendChild(document.createTextNode('Cole a URL do Web App na constante '));
    p.appendChild(el('code', '', 'API_URL'));
    p.appendChild(document.createTextNode(', no topo do script deste arquivo.'));
    lista.appendChild(estado('ajuste', 'Falta um ajuste', p));
  } else if (!reg && erroAtual) {
    lista.appendChild(estado('erro', 'Não consegui carregar', erroAtual, 'Tentar de novo'));
  } else if (!reg) {
    for (let i = 0; i < 4; i++) {
      const o = el('li', 'osso');
      const a = el('i'), b = el('i');
      b.style.width = [72, 54, 64, 40][i] + '%';
      o.appendChild(a); o.appendChild(b);
      lista.appendChild(o);
    }
  } else if (!reg.eventos.length) {
    lista.appendChild(ehHoje
      ? estado('livre', 'Dia livre', 'Nenhum compromisso na agenda de hoje. Aproveite!')
      : estado('livre', 'Nada marcado', 'Nenhum compromisso na agenda neste dia.'));
  } else {
    reg.eventos.forEach((ev, i) => lista.appendChild(linha(ev, sits[i])));
    if (rolarAoMostrar && ehHoje) {
      const alvo = lista.querySelector('.agora, .proximo');
      if (alvo) alvo.scrollIntoView({ block: 'nearest' });
    }
    rolarAoMostrar = false;
  }

  /* rodapé */
  const status = $('status');
  const btn = $('btn-atualizar');
  btn.classList.toggle('girando', carregando);
  status.classList.toggle('aviso', !carregando && !!erroAtual && !!reg);
  if (!configurado) status.textContent = 'Aguardando configuração';
  else if (carregando) status.textContent = 'Atualizando…';
  else if (erroAtual && reg) status.textContent = 'Sem conexão · dados das ' + fmtHora.format(reg.quando);
  else if (reg) status.textContent = 'Atualizado às ' + fmtHora.format(reg.quando);
  else status.textContent = 'Não atualizado';
}

/* ---------- navegação ---------- */
function irPara(data) {
  if (!dataValida(data) || data === dataSel) return;
  dataSel = data;
  erroAtual = '';
  rolarAoMostrar = true;
  $('rolagem').scrollTop = 0;
  carregar();
}
function irParaHoje() {
  const hj = hoje();
  if (dataSel === hj) { carregar(); return; }
  irPara(hj);
}

/* ---------- tela de senha ---------- */
function mostrarLogin(msg) {
  $('app').hidden = true;
  $('login').hidden = false;
  $('login-msg').textContent = msg || '';
  $('btn-entrar').disabled = false;
  $('btn-entrar').textContent = 'Entrar';
  const campo = $('campo-senha');
  campo.value = '';
  setTimeout(() => campo.focus(), 50);
}
function mostrarApp() {
  $('login').hidden = true;
  $('app').hidden = false;
}
async function entrar(ev) {
  ev.preventDefault();
  const senha = $('campo-senha').value.trim();
  if (!senha) return;
  const btn = $('btn-entrar');
  btn.disabled = true;
  btn.textContent = 'Entrando…';
  $('login-msg').textContent = '';
  try {
    const data = hoje();
    const r = await chamar(senha, data);
    if (r && r.ok === true) {
      guardarSenha(senha);                    // só guarda depois que o servidor aceitou
      dataSel = data;
      cache.set(data, { eventos: Array.isArray(r.eventos) ? r.eventos : [], quando: Date.now() });
      erroAtual = '';
      carregando = false;
      rolarAoMostrar = true;
      mostrarApp();
      render(true);
      return;
    }
    $('login-msg').textContent = r && r.erro === 'senha' ? 'Senha incorreta.' : ((r && r.mensagem) || 'O servidor devolveu um erro.');
  } catch (e) {
    $('login-msg').textContent = e.message || 'Não foi possível entrar.';
  }
  btn.disabled = false;
  btn.textContent = 'Entrar';
  $('campo-senha').select();
}
function sair() {
  esquecerSenha();
  cache.clear();
  pedidoAtual++;
  carregando = false;
  erroAtual = '';
  mostrarLogin('');
}

/* ---------- manifesto embutido (instalar como app) ---------- */
function instalarManifesto() {
  try {
    if (!/^https?:$/.test(location.protocol)) return;
    const base = location.origin + location.pathname;
    const icone192 = document.querySelector('link[rel="icon"]').href;
    const manifesto = {
      name: 'Agenda', short_name: 'Agenda', lang: 'pt-BR',
      id: base, start_url: base, scope: base.replace(/[^/]*$/, ''),
      display: 'standalone', background_color: '#0b0d12', theme_color: '#0b0d12',
      icons: [
        { src: icone192, sizes: '192x192', type: 'image/png', purpose: 'any' },
        { src: window.ICONE_512, sizes: '512x512', type: 'image/png', purpose: 'any' }
      ]
    };
    const link = document.createElement('link');
    link.rel = 'manifest';
    link.href = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifesto));
    document.head.appendChild(link);
  } catch (e) {}
}

/* ---------- partida ---------- */
function iniciar() {
  instalarManifesto();
  $('login-icone').src = document.querySelector('link[rel="apple-touch-icon"]').href;

  $('btn-ant').addEventListener('click', () => irPara(somarDias(dataSel, -1)));
  $('btn-prox').addEventListener('click', () => irPara(somarDias(dataSel, 1)));
  $('btn-hoje').addEventListener('click', irParaHoje);
  $('btn-atualizar').addEventListener('click', carregar);
  $('btn-sair').addEventListener('click', sair);
  $('form-login').addEventListener('submit', entrar);
  // Calendário: no celular o toque cai direto no seletor nativo (invisível sobre o botão);
  // no computador o botão abre o calendário por código.
  const seletor = $('seletor');
  const abrePorCodigo = typeof seletor.showPicker === 'function' && !matchMedia('(pointer: coarse)').matches;
  if (abrePorCodigo) {
    const abrir = () => { try { seletor.showPicker(); } catch (err) { seletor.focus(); } };
    seletor.parentElement.classList.add('por-codigo');
    seletor.parentElement.addEventListener('click', e => { e.preventDefault(); abrir(); });
    seletor.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(); } });
  }
  seletor.addEventListener('change', e => {
    if (e.target.value) irPara(e.target.value); else irParaHoje();   // "limpar" no seletor volta pra hoje
    if (abrePorCodigo) seletor.blur();
  });
  document.addEventListener('keydown', e => {
    if ($('app').hidden || e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowLeft') irPara(somarDias(dataSel, -1));
    else if (e.key === 'ArrowRight') irPara(somarDias(dataSel, 1));
    else if (e.key === 'h' || e.key === 'H') irParaHoje();
  });

  // A cada 5 minutos, se a janela estiver visível.
  setInterval(() => { if (!document.hidden && !$('app').hidden) carregar(); }, ATUALIZAR_A_CADA);

  // Relógio: troca o "agora / a seguir" e vira o dia à meia-noite sem buscar nada.
  setInterval(() => {
    if (document.hidden || $('app').hidden) return;
    const hj = hoje();
    if (hj !== ultimoHoje) {
      const seguia = dataSel === ultimoHoje;
      ultimoHoje = hj;
      if (seguia) { irPara(hj); return; }
    }
    render(false);
  }, 20000);

  // Quando a janela volta a ficar visível: atualiza. Se ficou muito tempo fora, reabre em hoje.
  function voltou() {
    if (document.hidden || $('app').hidden) return;
    const fora = escondidoDesde ? Date.now() - escondidoDesde : 0;
    escondidoDesde = 0;
    const hj = hoje();
    const seguia = dataSel === ultimoHoje;
    ultimoHoje = hj;
    if (dataSel !== hj && (seguia || fora >= VOLTAR_PRA_HOJE_APOS)) { irPara(hj); return; }
    carregar();
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) escondidoDesde = Date.now(); else voltou();
  });
  window.addEventListener('pageshow', e => { if (e.persisted) voltou(); });
  window.addEventListener('online', () => { if (!document.hidden && !$('app').hidden) carregar(); });

  if (configurado && !lerSenha()) { mostrarLogin(''); return; }
  mostrarApp();
  carregar();
}
document.addEventListener('DOMContentLoaded', iniciar);
</script>
